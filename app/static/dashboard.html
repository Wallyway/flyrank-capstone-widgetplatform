<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leads · Widget Platform</title>
  <link rel="stylesheet" href="/static/design-tokens.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: var(--font); background: var(--canvas); color: var(--ink);
      -webkit-font-smoothing: antialiased; padding-bottom: 96px;
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Expo's nav is a plain white bar with a hairline. No blur, no material. */
    .bar {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: 16px;
      padding: 14px 28px;
      background: var(--canvas);
      border-bottom: 1px solid var(--hairline-strong);
    }
    .bar h1 { font-size: 14px; font-weight: 600; }
    .bar .spacer { flex: 1; }
    .muted { color: var(--body); font-size: 13px; }
    .mono { font-family: var(--mono); }

    .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 28px 0; }

    /* Black is the primary action. Nothing else in this interface is black. */
    button {
      font-family: inherit; font-size: 14px; font-weight: 500; line-height: 1;
      height: 40px; padding: 0 18px; cursor: pointer;
      color: var(--ink); background: var(--canvas);
      border: 1px solid var(--hairline-strong); border-radius: var(--r-md);
      transition: background var(--speed) var(--ease), border-color var(--speed) var(--ease);
    }
    button:hover { background: var(--canvas-soft); }
    button.primary {
      background: var(--primary); border-color: var(--primary); color: #ffffff;
    }
    button.primary:hover { background: var(--primary-active); border-color: var(--primary-active); }
    button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    /* A solid edge instead of a coloured glow — this system spends no colour
       on chrome. */
    input {
      font-family: inherit; font-size: 16px; color: var(--ink);
      width: 100%; height: 44px; padding: 0 15px;
      background: var(--canvas); border: 1px solid var(--hairline-strong);
      border-radius: var(--r-md); outline: none;
      transition: border-color var(--speed) var(--ease);
    }
    input:focus { border: 2px solid var(--ink); padding: 0 14px; }
    input::placeholder { color: var(--muted); }

    /* --- the key gate ---------------------------------------------------- */
    .gate { max-width: 400px; margin: 96px auto; text-align: center; }
    .gate h2 { font-size: 36px; font-weight: 600; line-height: 1.15; letter-spacing: -1.08px; }
    .gate p { margin: 12px 0 24px; font-size: 16px; line-height: 1.5; color: var(--body); }
    .gate form { display: flex; flex-direction: column; gap: 12px; }
    .gate code {
      font-family: var(--mono); font-size: 13px;
      background: var(--surface-strong); border-radius: var(--r-xs); padding: 2px 6px;
    }
    .gate button { width: 100%; }

    /* --- KPI row --------------------------------------------------------- */
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 12px; }
    .kpi {
      background: var(--canvas); border: 1px solid var(--hairline-strong);
      border-radius: var(--r-lg); padding: 24px;
    }
    /* One dark tile against a white page. The most Expo gesture there is. */
    .kpi.feature { background: var(--surface-dark); border-color: var(--surface-dark); }
    .kpi.feature .label { color: var(--on-dark-soft); }
    .kpi.feature .value { color: var(--on-dark); }
    .kpi .label {
      font-size: 11px; font-weight: 600; line-height: 1.4;
      letter-spacing: 0.88px; text-transform: uppercase; color: var(--body);
    }
    .kpi .value {
      margin-top: 10px; font-size: 28px; font-weight: 600; line-height: 1.2;
      letter-spacing: -0.84px; font-variant-numeric: tabular-nums; color: var(--ink);
    }
    .kpi .value.dim { color: var(--body); }

    /* --- panels ---------------------------------------------------------- */
    .panel {
      background: var(--canvas); border: 1px solid var(--hairline-strong);
      border-radius: var(--r-lg); padding: 24px; margin-top: 20px;
    }
    .panel h3 {
      font-size: 11px; font-weight: 600; line-height: 1.4;
      letter-spacing: 0.88px; text-transform: uppercase; color: var(--body);
      display: flex; align-items: baseline; gap: 10px;
    }
    .panel h3 span { letter-spacing: 0; text-transform: none; font-weight: 400; font-size: 13px; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 800px) { .cols { grid-template-columns: 1fr; } }
    .cols .panel { margin-top: 0; }

    /* --- chart ----------------------------------------------------------- */
    .chart { margin-top: 20px; width: 100%; height: 132px; display: block; overflow: visible; }
    .chart rect { fill: var(--ink); transition: opacity var(--speed) var(--ease); }
    .chart rect:hover { opacity: .6; }
    .chart text { fill: var(--muted); font-size: 10px; }

    /* --- ranked lists ---------------------------------------------------- */
    .rank { margin-top: 18px; display: flex; flex-direction: column; gap: 14px; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: baseline; }
    .row .name { font-size: 14px; font-weight: 500; color: var(--ink); }
    .row .name small { display: block; color: var(--body); font-size: 13px; font-weight: 400; margin-top: 3px; }
    .row .count { font-size: 14px; font-variant-numeric: tabular-nums; color: var(--body); }
    .track { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--surface-strong); overflow: hidden; }
    .track i { display: block; height: 100%; background: var(--ink); border-radius: 2px; }

    /* --- table ----------------------------------------------------------- */
    .scroll { overflow-x: auto; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th {
      font-size: 11px; font-weight: 600; letter-spacing: 0.88px; text-transform: uppercase;
      text-align: left; color: var(--body);
      padding: 12px 12px 12px 0; border-bottom: 1px solid var(--hairline-strong); white-space: nowrap;
    }
    td { padding: 14px 12px 14px 0; border-bottom: 1px solid var(--hairline); vertical-align: top; }
    tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: var(--canvas-soft); }
    td .sub { color: var(--body); font-size: 13px; margin-top: 3px; }
    .pill {
      display: inline-block; padding: 4px 10px; border-radius: var(--r-pill);
      font-family: var(--mono); font-size: 11px;
      background: var(--surface-strong); color: var(--ink); white-space: nowrap;
    }
    .empty { padding: 40px 0; text-align: center; color: var(--body); font-size: 14px; }
    .error { color: var(--ink); font-size: 13px; border-left: 2px solid var(--error-line); padding-left: 10px; }
    .error:empty { display: none; }
  </style>
</head>
<body>
  <div class="bar">
    <h1>Leads</h1>
    <span class="muted" id="scope"></span>
    <span class="spacer"></span>
    <span class="muted" id="updated"></span>
    <button id="refresh" hidden>Refresh</button>
    <button id="signout" hidden>Sign out</button>
  </div>

  <div class="wrap">
    <section class="gate" id="gate" hidden>
      <h2>Your API key</h2>
      <p>Paste the key <code>scripts/seed.py</code> printed. It stays in this browser and is sent as
         a bearer token — the server only ever stored its hash.</p>
      <form id="gate-form">
        <input id="key" type="password" placeholder="wpk_…" autocomplete="off" spellcheck="false">
        <button class="primary" type="submit">Open dashboard</button>
        <p class="error" id="gate-error"></p>
      </form>
    </section>

    <div id="app" hidden>
      <div class="kpis" id="kpis"></div>

      <div class="panel">
        <h3>Submissions per day <span id="chart-range"></span></h3>
        <svg class="chart" id="chart" role="img" aria-label="Submissions per day"></svg>
      </div>

      <div class="cols" style="margin-top:22px">
        <div class="panel" style="margin-top:0">
          <h3>By widget</h3>
          <div class="rank" id="widgets"></div>
        </div>
        <div class="panel" style="margin-top:0">
          <h3>By country</h3>
          <div class="rank" id="geo"></div>
        </div>
      </div>

      <div class="panel">
        <h3>Recent submissions <span id="sub-count"></span></h3>
        <div class="scroll"><table id="table"></table></div>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var KEY_STORE = "widget-platform-api-key";
  var el = function (id) { return document.getElementById(id); };
  var lastSeries = null;

  function readKey() {
    try { return localStorage.getItem(KEY_STORE) || ""; } catch (e) { return ""; }
  }
  function writeKey(value) {
    try { value ? localStorage.setItem(KEY_STORE, value) : localStorage.removeItem(KEY_STORE); } catch (e) {}
  }

  // Every number on this page comes from the API. The page holds no logic of
  // its own beyond arranging what it is given.
  function api(path, key) {
    return fetch(path, { headers: { Authorization: "Bearer " + key } }).then(function (response) {
      if (response.status === 401) throw new Error("unauthorized");
      if (!response.ok) throw new Error("HTTP " + response.status);
      return response.json();
    });
  }

  function fmt(n) { return (n === null || n === undefined) ? "—" : String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

  function when(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    var mins = Math.round((Date.now() - d.getTime()) / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + "m ago";
    if (mins < 1440) return Math.round(mins / 60) + "h ago";
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  function kpis(overview) {
    var cards = [
      { label: "Total leads", value: fmt(overview.total), feature: true },
      { label: "Last 7 days", value: fmt(overview.last_7_days) },
      { label: "Last 24 hours", value: fmt(overview.last_24_hours) },
      { label: "Spam blocked", value: fmt(overview.spam_blocked), dim: true },
      { label: "Located", value: overview.enriched_percent + "%", dim: true }
    ];
    el("kpis").innerHTML = cards.map(function (c) {
      return '<div class="kpi' + (c.feature ? " feature" : "") + '"><div class="label">' + c.label + "</div>" +
             '<div class="value' + (c.dim ? " dim" : "") + '">' + c.value + "</div></div>";
    }).join("");
  }

  // Hand-drawn SVG rather than a charting library: it is a bar chart of 14
  // numbers, and a dependency would be bigger than the code it replaces.
  function chart(series) {
    var svg = el("chart");
    var width = svg.clientWidth || 900, height = 132;
    var top = Math.max.apply(null, series.map(function (d) { return d.total; }).concat([1]));
    var gap = 6, barWidth = Math.max(4, (width - gap * (series.length - 1)) / series.length);
    var parts = series.map(function (d, i) {
      var h = Math.max(d.total ? 3 : 1, Math.round((d.total / top) * (height - 22)));
      var x = i * (barWidth + gap);
      var label = d.day.slice(5);
      return '<rect x="' + x.toFixed(1) + '" y="' + (height - 18 - h) + '" width="' + barWidth.toFixed(1) +
             '" height="' + h + '" rx="3" opacity="' + (d.total ? 1 : 0.12) + '"><title>' +
             label + " · " + d.total + '</title></rect>' +
             (series.length <= 16 || i % 3 === 0
               ? '<text x="' + (x + barWidth / 2).toFixed(1) + '" y="' + (height - 4) + '" text-anchor="middle">' + label + "</text>"
               : "");
    });
    svg.setAttribute("viewBox", "0 0 " + width + " " + height);
    svg.innerHTML = parts.join("");
    el("chart-range").textContent = series.length + " days · peak " + top;
  }

  function ranked(target, rows, nameOf, subOf, countOf) {
    var node = el(target);
    if (!rows.length) { node.innerHTML = '<p class="empty">Nothing yet.</p>'; return; }
    var top = Math.max.apply(null, rows.map(countOf).concat([1]));
    node.innerHTML = rows.map(function (r) {
      var pct = Math.round((countOf(r) / top) * 100);
      var sub = subOf(r);
      return '<div class="row"><div class="name">' + escapeHtml(nameOf(r)) +
             (sub ? "<small>" + escapeHtml(sub) + "</small>" : "") + "</div>" +
             '<div class="count">' + fmt(countOf(r)) + "</div>" +
             '<div class="track"><i style="width:' + pct + '%"></i></div></div>';
    }).join("");
  }

  function escapeHtml(value) {
    return String(value === null || value === undefined ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function table(page) {
    var node = el("table");
    el("sub-count").textContent = page.total + " total";
    if (!page.items.length) {
      node.innerHTML = "";
      node.insertAdjacentHTML("afterend", "");
      node.innerHTML = '<tr><td><p class="empty">No submissions yet. Open the test site and send one.</p></td></tr>';
      return;
    }
    var head = "<tr><th>Submission</th><th>Widget</th><th>Location</th><th>When</th></tr>";
    var body = page.items.map(function (row) {
      var data = row.data || {};
      var headline = data.email || data.name || Object.values(data)[0] || "—";
      var rest = Object.keys(data).filter(function (k) { return data[k] !== headline; })
        .map(function (k) { return k + ": " + data[k]; }).join(" · ");
      var place = row.city ? row.city + ", " + row.country : (row.country || "—");
      return "<tr><td>" + escapeHtml(headline) + (rest ? '<div class="sub">' + escapeHtml(rest) + "</div>" : "") + "</td>" +
             '<td><span class="pill">' + escapeHtml(row.widget_id) + "</span></td>" +
             "<td>" + escapeHtml(place) +
             (row.geo_status !== "ok" ? '<div class="sub">' + escapeHtml(row.geo_status) + "</div>" : "") + "</td>" +
             "<td>" + when(row.created_at) + "</td></tr>";
    }).join("");
    node.innerHTML = head + body;
  }

  function showGate(message) {
    el("app").hidden = true;
    el("gate").hidden = false;
    el("refresh").hidden = true;
    el("signout").hidden = true;
    el("scope").textContent = "";
    el("updated").textContent = "";
    el("gate-error").textContent = message || "";
  }

  function load(key) {
    el("gate").hidden = true;
    el("app").hidden = false;
    el("refresh").hidden = false;
    el("signout").hidden = false;
    el("updated").textContent = "loading…";

    Promise.all([
      api("/api/stats/overview", key),
      api("/api/stats/timeseries?days=14", key),
      api("/api/stats/by-widget", key),
      api("/api/stats/geo", key),
      api("/api/submissions?limit=25", key)
    ]).then(function (results) {
      kpis(results[0]);
      lastSeries = results[1];
      chart(results[1]);
      ranked("widgets", results[2],
        function (r) { return r.title; },
        function (r) { return r.type + (r.spam ? " · " + r.spam + " spam blocked" : ""); },
        function (r) { return r.total; });
      ranked("geo", results[3],
        function (r) { return r.country; },
        function () { return ""; },
        function (r) { return r.total; });
      table(results[4]);
      el("scope").textContent = "last submission " + when(results[0].last_submission_at);
      el("updated").textContent = "updated " + new Date().toLocaleTimeString();
    }).catch(function (error) {
      if (error.message === "unauthorized") { writeKey(""); showGate("That key was not accepted."); return; }
      el("updated").textContent = "";
      el("scope").innerHTML = '<span class="error">Could not load: ' + escapeHtml(error.message) + "</span>";
    });
  }

  el("gate-form").addEventListener("submit", function (event) {
    event.preventDefault();
    var key = el("key").value.trim();
    if (!key) return;
    writeKey(key);
    load(key);
  });
  el("refresh").addEventListener("click", function () { load(readKey()); });
  el("signout").addEventListener("click", function () { writeKey(""); el("key").value = ""; showGate(""); });
  // Redraw the chart on resize, but do not refetch: the bars are the only
  // thing that depends on the width.
  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { if (lastSeries) chart(lastSeries); }, 150);
  });

  var stored = readKey();
  if (stored) load(stored); else showGate("");
})();
</script>
</body>
</html>
