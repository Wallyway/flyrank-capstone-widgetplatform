<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leads · Widget Platform</title>
  <link rel="stylesheet" href="/static/design-tokens.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: var(--font); background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased; padding-bottom: 80px;
    }
    a { color: var(--accent); }

    .bar {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: 16px;
      padding: 14px 28px; border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg) 72%, transparent);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
    }
    .bar h1 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
    .bar .spacer { flex: 1; }
    .muted { color: var(--text-2); font-size: 13px; letter-spacing: -.004em; }

    .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 28px 0; }

    button {
      font-family: inherit; font-size: 13px; font-weight: 500; letter-spacing: -.004em;
      color: var(--text); background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius-xs);
      padding: 7px 14px; cursor: pointer;
      transition: background var(--speed) var(--ease), transform var(--speed) var(--ease);
    }
    button:hover { background: var(--surface-2); transform: translateY(-1px); }
    button:active { transform: none; }
    button.primary { background: var(--accent); border-color: transparent; color: #fff; }
    button.primary:hover { background: var(--accent-hover); }
    button:focus-visible { outline: none; box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 28%, transparent); }

    input {
      font-family: inherit; font-size: 15px; color: var(--text);
      width: 100%; padding: 11px 13px;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius-xs); outline: none;
      transition: border-color var(--speed) var(--ease), box-shadow var(--speed) var(--ease);
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }

    /* --- the key gate ---------------------------------------------------- */
    .gate { max-width: 400px; margin: 96px auto; text-align: center; }
    .gate h2 { font-size: 28px; font-weight: 600; letter-spacing: -.021em; }
    .gate p { margin: 10px 0 24px; font-size: 15px; line-height: 1.47; color: var(--text-2); }
    .gate form { display: flex; flex-direction: column; gap: 12px; }
    .gate code {
      font-family: var(--mono); font-size: 12px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 6px; padding: 2px 6px;
    }

    /* --- KPI row --------------------------------------------------------- */
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
    .kpi {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 18px 20px; box-shadow: var(--shadow);
    }
    .kpi .label { font-size: 12px; font-weight: 500; color: var(--text-2); letter-spacing: -.002em; }
    .kpi .value {
      margin-top: 6px; font-size: 32px; font-weight: 600;
      letter-spacing: -.024em; font-variant-numeric: tabular-nums;
    }
    .kpi .value.dim { color: var(--text-2); }

    /* --- panels ---------------------------------------------------------- */
    .panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 22px 24px; margin-top: 22px;
    }
    .panel h3 {
      font-size: 15px; font-weight: 600; letter-spacing: -.01em;
      display: flex; align-items: baseline; gap: 10px;
    }
    .panel h3 span { font-size: 13px; font-weight: 400; color: var(--text-2); }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
    @media (max-width: 800px) { .cols { grid-template-columns: 1fr; } }
    .cols .panel { margin-top: 0; }

    /* --- chart ----------------------------------------------------------- */
    .chart { margin-top: 18px; width: 100%; height: 132px; display: block; overflow: visible; }
    .chart rect { fill: var(--accent); transition: opacity var(--speed) var(--ease); }
    .chart rect:hover { opacity: .75; }
    .chart text { fill: var(--text-2); font-size: 10px; }

    /* --- ranked lists ---------------------------------------------------- */
    .rank { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: baseline; }
    .row .name { font-size: 14px; letter-spacing: -.006em; }
    .row .name small { display: block; color: var(--text-2); font-size: 12px; margin-top: 2px; }
    .row .count { font-size: 14px; font-variant-numeric: tabular-nums; color: var(--text-2); }
    .track { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
    .track i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }

    /* --- table ----------------------------------------------------------- */
    .scroll { overflow-x: auto; margin-top: 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left; font-weight: 500; color: var(--text-2);
      padding: 12px 12px 12px 0; border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    td { padding: 13px 12px 13px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr:last-child td { border-bottom: 0; }
    td .sub { color: var(--text-2); font-size: 12px; margin-top: 3px; }
    .pill {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 11px; font-weight: 500; background: var(--surface-2); color: var(--text-2);
      border: 1px solid var(--border); white-space: nowrap;
    }
    .empty { padding: 40px 0; text-align: center; color: var(--text-2); font-size: 14px; }
    .error { color: var(--danger); font-size: 13px; }

    .skeleton {
      background: linear-gradient(90deg, var(--surface-2) 25%, var(--border) 37%, var(--surface-2) 63%);
      background-size: 400% 100%; animation: shimmer 1.4s ease infinite;
      border-radius: 6px; color: transparent;
    }
    @keyframes shimmer { 0% { background-position: 100% 0 } 100% { background-position: 0 0 } }
  </style>
</head>
<body>
  <div class="bar">
    <h1>Leads</h1>
    <span class="muted" id="scope"></span>
    <span class="spacer"></span>
    <span class="muted" id="updated"></span>
    <button id="refresh" hidden>Refresh</button>
    <button id="signout" hidden>Sign out</button>
  </div>

  <div class="wrap">
    <section class="gate" id="gate" hidden>
      <h2>Your API key</h2>
      <p>Paste the key <code>scripts/seed.py</code> printed. It stays in this browser and is sent as
         a bearer token — the server only ever stored its hash.</p>
      <form id="gate-form">
        <input id="key" type="password" placeholder="wpk_…" autocomplete="off" spellcheck="false">
        <button class="primary" type="submit">Open dashboard</button>
        <p class="error" id="gate-error"></p>
      </form>
    </section>

    <div id="app" hidden>
      <div class="kpis" id="kpis"></div>

      <div class="panel">
        <h3>Submissions per day <span id="chart-range"></span></h3>
        <svg class="chart" id="chart" role="img" aria-label="Submissions per day"></svg>
      </div>

      <div class="cols" style="margin-top:22px">
        <div class="panel" style="margin-top:0">
          <h3>By widget</h3>
          <div class="rank" id="widgets"></div>
        </div>
        <div class="panel" style="margin-top:0">
          <h3>By country</h3>
          <div class="rank" id="geo"></div>
        </div>
      </div>

      <div class="panel">
        <h3>Recent submissions <span id="sub-count"></span></h3>
        <div class="scroll"><table id="table"></table></div>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var KEY_STORE = "widget-platform-api-key";
  var el = function (id) { return document.getElementById(id); };
  var lastSeries = null;

  function readKey() {
    try { return localStorage.getItem(KEY_STORE) || ""; } catch (e) { return ""; }
  }
  function writeKey(value) {
    try { value ? localStorage.setItem(KEY_STORE, value) : localStorage.removeItem(KEY_STORE); } catch (e) {}
  }

  // Every number on this page comes from the API. The page holds no logic of
  // its own beyond arranging what it is given.
  function api(path, key) {
    return fetch(path, { headers: { Authorization: "Bearer " + key } }).then(function (response) {
      if (response.status === 401) throw new Error("unauthorized");
      if (!response.ok) throw new Error("HTTP " + response.status);
      return response.json();
    });
  }

  function fmt(n) { return (n === null || n === undefined) ? "—" : String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

  function when(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    var mins = Math.round((Date.now() - d.getTime()) / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + "m ago";
    if (mins < 1440) return Math.round(mins / 60) + "h ago";
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  function kpis(overview) {
    var cards = [
      { label: "Total leads", value: fmt(overview.total) },
      { label: "Last 7 days", value: fmt(overview.last_7_days) },
      { label: "Last 24 hours", value: fmt(overview.last_24_hours) },
      { label: "Spam blocked", value: fmt(overview.spam_blocked), dim: true },
      { label: "Located", value: overview.enriched_percent + "%", dim: true }
    ];
    el("kpis").innerHTML = cards.map(function (c) {
      return '<div class="kpi"><div class="label">' + c.label + '</div>' +
             '<div class="value' + (c.dim ? " dim" : "") + '">' + c.value + "</div></div>";
    }).join("");
  }

  // Hand-drawn SVG rather than a charting library: it is a bar chart of 14
  // numbers, and a dependency would be bigger than the code it replaces.
  function chart(series) {
    var svg = el("chart");
    var width = svg.clientWidth || 900, height = 132;
    var top = Math.max.apply(null, series.map(function (d) { return d.total; }).concat([1]));
    var gap = 6, barWidth = Math.max(4, (width - gap * (series.length - 1)) / series.length);
    var parts = series.map(function (d, i) {
      var h = Math.max(d.total ? 3 : 1, Math.round((d.total / top) * (height - 22)));
      var x = i * (barWidth + gap);
      var label = d.day.slice(5);
      return '<rect x="' + x.toFixed(1) + '" y="' + (height - 18 - h) + '" width="' + barWidth.toFixed(1) +
             '" height="' + h + '" rx="3" opacity="' + (d.total ? 1 : 0.28) + '"><title>' +
             label + " · " + d.total + '</title></rect>' +
             (series.length <= 16 || i % 3 === 0
               ? '<text x="' + (x + barWidth / 2).toFixed(1) + '" y="' + (height - 4) + '" text-anchor="middle">' + label + "</text>"
               : "");
    });
    svg.setAttribute("viewBox", "0 0 " + width + " " + height);
    svg.innerHTML = parts.join("");
    el("chart-range").textContent = series.length + " days · peak " + top;
  }

  function ranked(target, rows, nameOf, subOf, countOf) {
    var node = el(target);
    if (!rows.length) { node.innerHTML = '<p class="empty">Nothing yet.</p>'; return; }
    var top = Math.max.apply(null, rows.map(countOf).concat([1]));
    node.innerHTML = rows.map(function (r) {
      var pct = Math.round((countOf(r) / top) * 100);
      var sub = subOf(r);
      return '<div class="row"><div class="name">' + escapeHtml(nameOf(r)) +
             (sub ? "<small>" + escapeHtml(sub) + "</small>" : "") + "</div>" +
             '<div class="count">' + fmt(countOf(r)) + "</div>" +
             '<div class="track"><i style="width:' + pct + '%"></i></div></div>';
    }).join("");
  }

  function escapeHtml(value) {
    return String(value === null || value === undefined ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function table(page) {
    var node = el("table");
    el("sub-count").textContent = page.total + " total";
    if (!page.items.length) {
      node.innerHTML = "";
      node.insertAdjacentHTML("afterend", "");
      node.innerHTML = '<tr><td><p class="empty">No submissions yet. Open the test site and send one.</p></td></tr>';
      return;
    }
    var head = "<tr><th>Submission</th><th>Widget</th><th>Location</th><th>When</th></tr>";
    var body = page.items.map(function (row) {
      var data = row.data || {};
      var headline = data.email || data.name || Object.values(data)[0] || "—";
      var rest = Object.keys(data).filter(function (k) { return data[k] !== headline; })
        .map(function (k) { return k + ": " + data[k]; }).join(" · ");
      var place = row.city ? row.city + ", " + row.country : (row.country || "—");
      return "<tr><td>" + escapeHtml(headline) + (rest ? '<div class="sub">' + escapeHtml(rest) + "</div>" : "") + "</td>" +
             '<td><span class="pill">' + escapeHtml(row.widget_id) + "</span></td>" +
             "<td>" + escapeHtml(place) +
             (row.geo_status !== "ok" ? '<div class="sub">' + escapeHtml(row.geo_status) + "</div>" : "") + "</td>" +
             "<td>" + when(row.created_at) + "</td></tr>";
    }).join("");
    node.innerHTML = head + body;
  }

  function showGate(message) {
    el("app").hidden = true;
    el("gate").hidden = false;
    el("refresh").hidden = true;
    el("signout").hidden = true;
    el("scope").textContent = "";
    el("updated").textContent = "";
    el("gate-error").textContent = message || "";
  }

  function load(key) {
    el("gate").hidden = true;
    el("app").hidden = false;
    el("refresh").hidden = false;
    el("signout").hidden = false;
    el("updated").textContent = "loading…";

    Promise.all([
      api("/api/stats/overview", key),
      api("/api/stats/timeseries?days=14", key),
      api("/api/stats/by-widget", key),
      api("/api/stats/geo", key),
      api("/api/submissions?limit=25", key)
    ]).then(function (results) {
      kpis(results[0]);
      lastSeries = results[1];
      chart(results[1]);
      ranked("widgets", results[2],
        function (r) { return r.title; },
        function (r) { return r.type + (r.spam ? " · " + r.spam + " spam blocked" : ""); },
        function (r) { return r.total; });
      ranked("geo", results[3],
        function (r) { return r.country; },
        function () { return ""; },
        function (r) { return r.total; });
      table(results[4]);
      el("scope").textContent = "last submission " + when(results[0].last_submission_at);
      el("updated").textContent = "updated " + new Date().toLocaleTimeString();
    }).catch(function (error) {
      if (error.message === "unauthorized") { writeKey(""); showGate("That key was not accepted."); return; }
      el("updated").textContent = "";
      el("scope").innerHTML = '<span class="error">Could not load: ' + escapeHtml(error.message) + "</span>";
    });
  }

  el("gate-form").addEventListener("submit", function (event) {
    event.preventDefault();
    var key = el("key").value.trim();
    if (!key) return;
    writeKey(key);
    load(key);
  });
  el("refresh").addEventListener("click", function () { load(readKey()); });
  el("signout").addEventListener("click", function () { writeKey(""); el("key").value = ""; showGate(""); });
  // Redraw the chart on resize, but do not refetch: the bars are the only
  // thing that depends on the width.
  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { if (lastSeries) chart(lastSeries); }, 150);
  });

  var stored = readKey();
  if (stored) load(stored); else showGate("");
})();
</script>
</body>
</html>
