name: flyrank-capstone-widgetplatform
track: backend
capstone: Embeddable Widget & Lead-Capture Platform
language: python
framework: fastapi

run: docker compose up --build
seed: docker compose exec app python -m scripts.seed
test: docker compose exec app python -m pytest -q

base_url: http://localhost:8000
test_site_url: http://localhost:5500

endpoints:
  - method: GET
    path: /
    auth: none
  - method: GET
    path: /health
    auth: none
  - method: GET
    path: /widget.js?id={widget_id}
    auth: none
  - method: GET
    path: /static/widget.v1.js
    auth: none
  - method: GET
    path: /public/widgets/{widget_id}/config
    auth: none
  - method: OPTIONS
    path: /public/submissions
    auth: none
  - method: POST
    path: /public/submissions
    auth: none
  - method: GET
    path: /api/widgets
    auth: bearer
  - method: POST
    path: /api/widgets
    auth: bearer
  - method: GET
    path: /api/widgets/{widget_id}
    auth: bearer
  - method: PATCH
    path: /api/widgets/{widget_id}
    auth: bearer
  - method: DELETE
    path: /api/widgets/{widget_id}
    auth: bearer
  - method: GET
    path: /api/widgets/{widget_id}/embed
    auth: bearer
  - method: GET
    path: /api/submissions
    auth: bearer
  - method: GET
    path: /api/stats/overview
    auth: bearer
  - method: GET
    path: /api/stats/by-widget
    auth: bearer
  - method: GET
    path: /api/stats/geo
    auth: bearer
  - method: GET
    path: /api/stats/timeseries
    auth: bearer
